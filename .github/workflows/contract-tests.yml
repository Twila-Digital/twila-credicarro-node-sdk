name: Contract tests

on:
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test --workspace=contract-tests
