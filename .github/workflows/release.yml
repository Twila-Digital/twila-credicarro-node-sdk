name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  contract-tests:
    needs: ci
    uses: ./.github/workflows/contract-tests.yml

  publish:
    needs: [ci, contract-tests]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing exige npm >= 11.5.1; a versão é fixa para o publish ser reprodutível.
      - run: npm install -g npm@11.6.2

      # Sem scripts de ciclo de vida de dependências no job que tem o token OIDC; o build roda explicitamente depois.
      - run: npm ci --ignore-scripts

      - name: Define a versão do release (a partir da tag)
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag inválida: use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publica no npm (Trusted Publishing / OIDC)
        run: npm publish --access public --ignore-scripts

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
